  jaune d’hiver ressemble à un phare dans la végétation froide.
/gallery/Flore/20200427__fleurs_cimetière_6533DXO-BorderMaker.jpg: Le pavot de Californie.
  Prise en bouquet avec une très grande ouverture du diaphragme, ce qui permet un
  flou harmonieux et doux, cette photo a été prise dans le cimetière de Valence pendant
  le confinement.
/gallery/Flore/20200506__Jardin_macro_fleurs_7349DXO-BorderMaker.jpg: Le coquelicot.
  Cette photo a été prise dans mon jardin au printemps, avec une optique à très grande
  ouverture permettant un bokeh très harmonieux et doux.
/gallery/Flore/20220426_Orchidées_Rechefort_1823_DxO-BorderMaker-BorderMaker.jpg: Il
  s’agit ici d’une orchidée Ophrys drumana (de la Drôme). Sa particularité est qu’elle
  a une déformation génétique rare appelée lusus, ce qui explique qu’elle ait plusieurs
  lobes. On peut l’observer fin avril à mai dans les contreforts du Vercors.
/gallery/Flore/20250403_Pulsatilles_Rouge_4257_DxO-BorderMaker.jpg: Il s’agit ici
  d’une anémone hépatique, dans une ambiance disco avec des lumières artificielles.
  La fleur semble danser dans cette ambiance surréaliste.
/gallery/Flore/20250508_Orchidées_9348_DxO-BorderMaker.jpg: C’est la Star de Rochefort
  Samson, découverte par Jean-François Tisserand depuis plus de dix ans. Il s’agit
  d’une orchidée Ophrys fuciflora (bourdon) avec un lusus (déformation génétique).
  Ce qui est incroyable, c’est qu’elle refleurit chaque année grâce à ses microchampignons.
  Si on déplace une orchidée sauvage, elle ne pourra pas vivre en dehors de son milieu.
/gallery/Flore/20250508_Orchidées_9556_DxO-BorderMaker.jpg: Il s’agit ici d’une encolie
  des Alpes, prise en contre-plongée et à contre-jour. Cette fleur des montagnes est
  dirigée vers le sol ; on peut admirer son graphisme.
/gallery/Flore/20250809_Vacances Cancale_Famille_été_2025_6998_DxO-BorderMaker.jpg: Fleurs
  et plantes du paysage, mises en valeur par leurs formes, leurs couleurs et leurs
  textures. C'est une fleur des bords de mer de Bretagne.
/gallery/Flore/20260117_Gagées_0130-BorderMaker.jpg: La gagea des rochers dans une
  ambiance froide artificielle. Son environnement naturel est transformé dans une
  atmosphère imaginaire. L’ajout de fumée permet d’adoucir cette lumière par diffusion.
/gallery/Flore/20260228_Fleurs_Valence_9581-BorderMaker.jpg: Orchis Barlia (géante)
  est la première orchidée de la saison, qui démarre fin février. L’ajout de lumières
  chaudes artificielles permet de réchauffer la température de saison et met en évidence
  la richesse colorimétrique de cette fleur.
/gallery/Flore/20260311_Fritillaires_3729-BorderMaker.jpg: La fritillaire pintade
  est une fleur remarquable de l’Isère ; elle fleurit en mars dans les marais. J’ai
  utilisé une optique à très grande ouverture et de la fumée pour adoucir la composition
  très épurée.
/gallery/Flore/20260311_Fritillaires_3780-BorderMaker.jpg: Cette fritillaire pintade
  a été prise par une double exposition, gérée directement par l’appareil photo. Cet
  effet donne un aspect féérique dans son environnement naturel.
/gallery/Flore/20260311_Fritillaires_3992-BorderMaker.jpg: Cette fleur est une erythrone
  dent de chien (canis), elle apparaît en mars dans les sous-bois et en avril sur
  les pâturages. Cette photo a été réalisée avec de la fumée pour adoucir la composition
  et diffuser la lumière par réflexion. Les tâches blanches dessus sont des anémones
  des bois.
/gallery/Flore/20260311_Fritillaires_4413-BorderMaker.jpg: Fritillaire pintade dans
  une composition épurée, avec une très grande ouverture et en utilisant les herbes
  devant et derrière la fleur, qui apparaissent en flou.
/gallery/Flore/20260415_Pulsatille_Rubra_4013_DxO-BorderMaker.jpg: L’anémone rubra,
  ou la pulsatille rouge, est une fleur de la Drôme où elle reste cantonnée à une
  localité en nombre. Elle fleurit en avril. Cette photo a été réalisée par masquage,
  car le soleil était très violent.
/gallery/Flore/20260415_Pulsatille_Rubra_4113_DxO-BorderMaker.jpg: L’anémone hépatique
  est une fleur des sous-bois ; elle aime se mettre sous les hêtres. Composition épurée
  en grande ouverture pour mieux isoler mon sujet ; la fumée ajoute du dynamisme,
  comme si les fleurs dansaient autour.
/gallery/Flore/20260415_Pulsatille_Rubra_4137_Nik_DxO-BorderMaker.jpg: Il s’agit d’une
  pulsatille rouge. J’ai cherché à avoir une image épurée avec de la fumée, sauf que
  mon appareil a trop craché ; je me suis retrouvé avec un gros nuage. En rapportant
  l’image sur l’ordinateur, j’ai vu une autre photo où une silhouette apparaissait
  ; j’ai donc développé cette photo en high key, jeu de haute lumière et blancs.
/gallery/Flore/20260422_Flore_Erythrones_4974_DxO-BorderMaker.jpg: Erythrone dent
  de chien à Fond d’Urle en Drôme, prise en avril. Elle est dans une scène naturelle
  personnalisée comme podium pour célébrer le printemps alpin.
/gallery/Flore/20260422_Flore_Erythrones_5032_DxO-BorderMaker.jpg: Scille à deux feuilles
  à Font d’Urle, petite fleur qui comporte donc deux feuilles, ce qui en fait sa caractéristique.
  On retrouve une composition naturelle épurée ; le fond apparaît comme des touches
  d’aquarelle.
/gallery/Flore/20260422_Flore_Erythrones_5102_DxO-BorderMaker.jpg: Anémone alpine
  prise en avril. Le cœur de cette petite fleur est dressé vers le ciel. Pour apprécier
  la complexité de son graphisme, rien de mieux qu’une prise de vue en plongée. Il
  faut alors éclaircir par masquage le sol, qui sera le fond de la photo, pour garder
  une image claire.
/gallery/Flore/20260422_Flore_Erythrones_5129_DxO-BorderMaker.jpg: Qui n’a pas fait
  de randonnée à la fonte des neiges et retrouvé ces parterres de crocus ? Sur cette
  photo, j’ai joué avec le relief pour accentuer cette profusion de crocus qui ne
  semble plus finir.
/gallery/Flore/20260422_Flore_Erythrones_5189_DxO-BorderMaker.jpg: Sur les plateaux,
  on retrouve la jonquille, prisée par les randonneurs ; attention, ne pas en ramasser
  plus d’une poignée. Pour ma part, je ne cueille pas de fleurs sauvages ; je préfère
  les laisser aux copains photographes, qui pourront s’émerveiller devant.
/gallery/Flore/20260422_Flore_Erythrones_5279_DxO-BorderMaker.jpg: Cette erythrone
  est une rareté par sa couleur blanche ; on dit alors qu’elle est hypochrome (absence
  de pigmentation). J’ai croisé plusieurs orchidées hypochromes ; sur l’erythrone,
  c’est une première. Cette composition en douceur fait ressembler la fleur à une
  dame avec un grand chapeau blanc. Et vous, que voyez-vous ?
/gallery/Flore/20260422_Flore_Erythrones_5385_DxO-BorderMaker.jpg: Erythrone dent
  de chien hypochrome avec l’ajout d’une fumée légère, ajoutant un dynamisme à la
  composition.
/gallery/Flore/20260422_Flore_Erythrones_5446_DxO-BorderMaker.jpg: Gentiane printanière,
  petite fleur aux 5 pétales à ras le sol. Le sol étant fouillé, j’ai utilisé la fumée
  pour le couvrir et épurer ainsi la photo.
/gallery/Flore/20260422_Flore_Erythrones_5519_DxO-BorderMaker.jpg: Gentiane printanière
  avec des lumières chaudes et un léger voile de fumée. Cette composition se mélange
  ainsi à la peinture, comme si la fleur semblait flotter.
/gallery/Flore/20260422_Flore_Erythrones_5786_DxO-BorderMaker.jpg: Gagea fistuleuse,
  ou Gagea fragifera, est très appréciée par les chamois ; celle-ci a des déformations,
  une pétale de plus et un cœur fragmenté agrandi. J’ai choisi une composition poétique
  et douce, avec une grande ouverture du diaphragme de mon objectif.
/gallery/Flore/20260516_Orchidées_Rochefort_2153_DxO-BorderMaker.jpg: C’est une orchidée
  Ophrys fuciflora avec un lusus ; c’est incroyable, car avec ces fleurs, aucune ne
  se ressemble. Celle-ci est une belle curiosité, avec ses lobes qui rappellent de
  grandes oreilles ; on l’appelle l’ophrys Mickey. Jeu de bokeh et fumée pour adoucir.
/gallery/Flore/49984788136_a931919c8c_o.jpg: La star des orchidées françaises, c’est
  le sabot de Vénus ; en effet, ses fleurs ressemblent à de petits sabots. Cette photo
  a été prise en Chartreuse, où il existe une belle population. En contre-jour et
  avec une grande ouverture, ces sabots semblent flotter.
/gallery/Flore/51030109272_3dfae38b4a_o.jpg: Fritillaire pintade avec une prise de
  vue en double exposition. Elle se nomme en latin Fritillaria meleagris, 'meleagris,
  idis', désignant un oiseau. Sa robe marbrée en damier rappelle le plumage de la
  pintade.
/gallery/Flore/51591562074_177808556d_o.jpg: L’anémone du Japon est une fleur de mon
  jardin. J’ai donc l’opportunité d’apprécier sa finesse pour la restituer en photo,
  avec un masquage à la prise de vue pour éclaircir le fond en contre-jour.
/gallery/Flore/52962692549_c37fa64e2b_o.jpg: L’ophrys Mickey produit plusieurs branches
  en fonction de la pluie et du soleil obtenu. Je me suis servi d’un masquage végétal
  pour produire un bokeh harmonieux.
/gallery/Flore/55358865791_66c8b88a87_o.jpg: Orchidée hybride entre l’ophrys de la
  Drôme et l’ophrys araignée ; il y a donc un mélange de ces deux sous-espèces.
/gallery/Flore/55359288535_f5658aef00_o.jpg: L’orchis pourpre est une grande orchidée
  de nos prairies. J’ai joué de sa morphologie pour la faire apparaître entre un nuage
  végétal et de la fumée, qui définissent son cadre avec légèreté.
/gallery/Flore/55370803582_4bc8a8d3e4_o.jpg: La pulsatille vulgaire n’a de nom que
  le vulgaire, qui désigne sa profusion sur certaines localités. Je l’ai trouvée lors
  d’une balade autour de Notre-Dame de la Salette. J’ai profité d’une lumière basse
  et douce pour rendre une transparence sur ses pétales poilus.
/gallery/Flore/55371899718_5442f005f8_o.jpg: L’ophrys miroir est une rareté très convoitée
  dans notre région du Rhône-Alpes ; il y aurait autant de pieds connus que nous avons
  de doigts sur une main. J’ai profité d’un visiteur pour ajouter une touche à la
  composition.
/gallery/Flore/55458501827_be0127dd36_o.jpg: L’Edelweiss est la fleur sacrée de nos
  montagnes ; celle-ci a été vue dans la vallée d’Aoste, dans la chaîne du Mont-Blanc.
  Elle aime la rocaille, comme ici, qui m’a servi de réflecteur tout en maintenant
  la fleur dans l’ombre lors de la prise de vue.
/gallery/Flore/_O1A1656_DxO-BorderMaker.jpg: Il s’agit d’un lys d’une création de
  Iris Passion 26, dont l’iriseraie est basée à Saint-Marcel. Iris du jardin, pris
  en contre-jour en grande ouverture.
/gallery/Flore/_O1A1657_DxO-BorderMaker.jpg: Il s’agit d’un lys d’une création de
  Iris Passion 26, dont l’iriseraie est basée à Saint-Marcel. Iris du jardin, pris
  en contre-jour en grande ouverture.
/gallery/Flore/_O1A1661_DxO-BorderMaker.jpg: Il s’agit d’un lys d’une création de
  Iris Passion 26, dont l’iriseraie est basée à Saint-Marcel. Iris du jardin, pris
