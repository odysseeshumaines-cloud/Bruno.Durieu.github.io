/Accueil/Photo_Accueil.jpg: '« Mes photographies sont sans IA : chacune est un instant
  réel, arraché au temps, un moment véritablement vécu, parfois façonné avec d’autres
  artistes, parfois offert par la nature. Elles sont le témoignage humain de ce qui
  nous entoure. Je cherche la beauté dans mes images, mais la plus précieuse se cache
  derrière chacune d’elles : l’histoire d’une aventure humaine, où l’on donne et où
  l’on reçoit une forme d’amour, de partage. »'
