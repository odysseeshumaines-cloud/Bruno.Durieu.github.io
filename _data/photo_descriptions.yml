"/gallery/Mammiferes/20250920_Vercors_Animalier_4487_DxO-BorderMaker.jpg": >-
  Le chamois (Rupicapra rupicapra) est un mammifère ruminant de la famille
  des bovidés, emblématique des montagnes européennes, notamment des Alpes
  et des Pyrénées. Il mesure généralement autour de 70 à 80 cm au garrot.
  Ses cornes noires, recourbées vers l'arrière à leur extrémité, sont présentes
  chez les mâles comme chez les femelles. Son pelage, plus épais en hiver,
  varie du brun-roux en été à des tons plus foncés en hiver. Son visage porte
  des marques claires et sombres caractéristiques. Agile sur les pentes
  abruptes, il est adapté aux terrains rocailleux grâce à ses sabots.
  Les femelles et les jeunes vivent souvent en hardes ; le chamois est
  herbivore et fréquente les milieux montagneux.
