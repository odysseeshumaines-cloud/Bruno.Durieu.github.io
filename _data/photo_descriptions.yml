"/gallery/Mammiferes/20250920_Vercors_Animalier_4487_DxO-BorderMaker.jpg": >-
  Une randonnée dans le Vercors avec les enfants

  Avec les enfants, nous avons traversé le Vercors depuis le col du Rousset jusqu’à la cabane de Pré Peyret, perchée à 1 600 m. Après une longue marche, nous avons posé les sacs pour partir nous promener sur un sentier des environs.

  Au fil du chemin, j’ai repéré des traces de chamois. L’occasion était trop belle : j’ai décidé d’expliquer aux enfants comment pister les animaux. La piste nous a menés jusqu’à une femelle et son petit. J’ai alors installé les enfants en hauteur, pour qu’ils puissent observer la scène sans déranger les animaux, et je suis parti les contourner discrètement.

  C’est à ce moment-là que j’ai pris cette photo, en contre-jour, sous la lumière rasante du soleil.
"/Accueil/Photo_Accueil.jpg": >-
  « Mes photographies sont sans IA : chacune est un instant réel, arraché au temps, un moment véritablement vécu, parfois façonné avec d’autres artistes, 

  parfois offert par la nature. Elles sont le témoignage humain de ce qui nous entoure. Je cherche la beauté dans mes images, 
  
  mais la plus précieuse se cache derrière chacune d’elles : l’histoire d’une aventure humaine, où l’on donne et où l’on reçoit l’amour. »