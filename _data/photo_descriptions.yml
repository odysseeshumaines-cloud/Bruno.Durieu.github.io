"/Gallery/Mammiferes/20250920_Vercors_Animalier_4487_DxO-BorderMaker": "Le chamois (Rupicapra rupicapra) est un mammifère ruminant de la famille des bovidés, emblématique des montagnes européennes comme les Alpes et les Pyrénées.
D'une taille de 70 à 80 cm au garrot et pesant jusqu'à 60 kg, il se distingue par ses cornes noires recourbées, présentes chez les mâles et les femelles.
Son pelage change selon les saisons, passant d'un brun roussâtre en été à un brun foncé plus épais en hiver, avec un masque facial caractéristique blanc et noir.
Animal extrêmement agile, il gravit des pentes abruptes avec une facilité déconcertante grâce à ses sabots à deux doigts orientables et sa musculature puissante.
Vivant en hardes souvent dirigées par une femelle, il est herbivore et adapté aux environnements rocailleux et forestiers d'altitude."